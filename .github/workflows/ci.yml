name: Rust CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted-linux:
    name: Hosted Linux ${{ matrix.arch }} validation
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust stable, rustfmt, and Clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install BusyBox for OCI integration tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes busybox-static
          command -v busybox

      - name: Verify architecture
        run: |
          set -euo pipefail
          actual_arch="$(uname -m)"
          echo "Expected architecture: ${{ matrix.arch }}"
          echo "Actual architecture:   ${actual_arch}"
          test "${actual_arch}" = "${{ matrix.arch }}"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check runtime without test hooks
        run: cargo check -p tavik-runtime --no-default-features

      - name: Test runtime without test hooks
        run: cargo test -p tavik-runtime --no-default-features

      - name: Report privileged tests delegated to rootful local VM suite
        run: |
          echo "=== Privileged tests delegated to rootful Linux ARM64 local VM suite ==="
          echo "The following tests require privileged PID namespaces, mount namespaces, or rootful cgroups v2:"
          echo "  - tavik-runtime: executor::tests::test_executor_create_state_and_delete (marked #[ignore])"
          echo "  - tavik-cgroups: test_linux_cgroup_lifecycle"
          echo "  - tavik-core: image_service_test::test_create_and_run_container_linux_e2e"
          echo "  - tavik-integration-tests (37 tests in oci_runtime_test):"
          echo "      test_oci_bundle_validation_and_executor"
          echo "      test_linux_container_pid_namespace_and_lifecycle"
          echo "      test_linux_cgroup_lifecycle"
          echo "      test_linux_cgroups_v2_resource_enforcement"
          echo "      test_linux_capability_bounding_set_and_drops"
          echo "      test_linux_seccomp_bpf_filter_enforcement"
          echo "      test_cgroups_memory_accounting"
          echo "      test_cgroups_pids_limit"
          echo "      test_combined_security_hardening"
          echo "      test_explicit_uid_gid_zero_credential_transition"
          echo "      test_exact_supplementary_group_isolation_empty"
          echo "      test_exact_supplementary_group_isolation_multiple"
          echo "      test_working_directory_inaccessible_to_container_user"
          echo "      test_container_creation_retry_with_same_id_after_failure"
          echo "      test_working_directory_validation_runtime"
          echo "      test_runtime_path_resolution_variants"
          echo "      test_seccomp_filter_blocks_syscall"
          echo "      test_short_lived_process_startup_success"
          echo "      test_stop_rejects_suspend_and_resume_signals"
          echo "      test_daemon_oci_container_ipc"
          echo "      test_concurrent_start_requests_atomic_rejection"
          echo "      test_state_transitions_serialize_and_prevent_stopped_overwrite"
          echo "      test_delete_starting_and_running_container_rejection"
          echo "      test_linux_delete_created_container_with_cgroups"
          echo "      test_linux_delete_created_container_without_cgroups"
          echo "      test_linux_force_delete_running_container"
          echo "      test_cgroup_ownership_rules_never_destroy_unowned"
          echo "      test_durable_cgroup_ownership_and_deletion_safety"
          echo "      test_e2e_real_supervisor_unexpected_exit_and_force_delete"
          echo "      test_force_delete_does_not_signal_unrelated_process_on_pid_reuse"
          echo "      test_repeated_short_lived_process_lifecycle"
          echo "      test_stale_control_socket_recovery_allows_force_delete_and_cleanup_pending"
          echo "      test_cleanup_retry_successfully_removes_cgroup_and_marker"
          echo "      test_cgroup_destruction_propagates_kill_and_process_errors"
          echo "      test_linux_lifecycle_graceful_stop_and_acknowledgment"
          echo "      test_signal_escalation_esrch_and_pidfd_exit"
          echo "These tests are verified against real Linux kernel semantics by the local UTM ARM64 rootful validation workflow."

      - name: Run full workspace tests as ordinary user
        run: cargo test --workspace --no-fail-fast
