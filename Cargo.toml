[workspace]
resolver = "2"
members = [
    "crates/tavik-common",
    "crates/tavik-core",
    "crates/tavik-daemon",
    "crates/tavik-cli",
    "crates/tavik-runtime",
    "crates/tavik-cgroups",
    "crates/tavik-security",
    "crates/tavik-registry",
    "crates/tavik-store",
    "tests/integration",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["TAVIK Maintainers"]
license = "Apache-2.0"
homepage = "https://github.com/aryanverma/tavik"
repository = "https://github.com/aryanverma/tavik"
readme = "README.md"

[workspace.dependencies]
tavik-common = { path = "crates/tavik-common" }
tavik-core = { path = "crates/tavik-core" }
tavik-daemon = { path = "crates/tavik-daemon" }
tavik-runtime = { path = "crates/tavik-runtime" }
tavik-cgroups = { path = "crates/tavik-cgroups" }
tavik-security = { path = "crates/tavik-security" }
tavik-registry = { path = "crates/tavik-registry" }
tavik-store = { path = "crates/tavik-store" }

tokio = { version = "1.41", features = ["full"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2.0"
anyhow = "1.0"
bytes = "1.8"
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", features = ["sink"] }
uuid = { version = "1.11", features = ["v4", "fast-rng"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3.14"
rustix = { version = "1.1", features = ["process", "fs", "mount"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
sha2 = "0.10"
hex = "0.4"
url = "2.5"
